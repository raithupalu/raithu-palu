name: Mirror mongod
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download mongod
        run: |
          curl -L -o /tmp/mongodb.tgz https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-6.0.14.tgz
          echo "Downloaded"
          ls -lh /tmp/mongodb.tgz
          mkdir -p /tmp/extract
          tar -xzf /tmp/mongodb.tgz -C /tmp/extract --strip-components=1
          ls -lh /tmp/extract/bin/mongod
          cp /tmp/extract/bin/mongod /tmp/mongod
          ls -lh /tmp/mongod
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongod-binary
          path: /tmp/mongod
          retention-days: 1
